services:
  tibo:
    build:
      context: .
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      LIVE_COLLECTION: ${LIVE_COLLECTION:-0}
      POLL_SECONDS: ${POLL_SECONDS:-120}
      ALLOW_REFERENCE_FALLBACK: ${ALLOW_REFERENCE_FALLBACK:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    volumes:
      - tibo-data:/app/.data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  tibo-data:
